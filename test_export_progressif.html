<!DOCTYPE html>
<html>
<head>
    <title>Test Export Progressif Articles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .progress-container {
            max-width: 600px;
            margin: 50px auto;
        }
        .log {
            height: 300px;
            overflow-y: auto;
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="progress-container">
            <h2>Test Export Progressif - Articles</h2>
            <p>21 873 articles à exporter avec suivi temps réel</p>
            
            <div class="btn-group mb-3">
                <button class="btn btn-success" onclick="testExport('excel')">Export Excel Progressif</button>
                <button class="btn btn-danger" onclick="testExport('pdf')">Export PDF Progressif</button>
            </div>
            
            <!-- Barre de progression -->
            <div class="progress mb-3" style="height: 25px;">
                <div class="progress-bar progress-bar-striped progress-bar-animated" 
                     id="progressBar" 
                     style="width: 0%">0%</div>
            </div>
            
            <!-- Message de statut -->
            <div class="alert alert-info" id="statusMessage">
                Prêt pour l'export...
            </div>
            
            <!-- Log en temps réel -->
            <div class="log" id="exportLog">
                === Log d'export ===<br>
            </div>
            
            <!-- Lien de téléchargement -->
            <div id="downloadSection" style="display: none;">
                <a id="downloadLink" class="btn btn-primary" download>Télécharger le fichier</a>
            </div>
        </div>
    </div>

    <script>
        function addLog(message) {
            const log = document.getElementById('exportLog');
            const timestamp = new Date().toLocaleTimeString();
            log.innerHTML += `[${timestamp}] ${message}<br>`;
            log.scrollTop = log.scrollHeight;
        }

        function updateProgress(percentage, message, processed = 0, total = 0) {
            const progressBar = document.getElementById('progressBar');
            const statusMessage = document.getElementById('statusMessage');
            
            progressBar.style.width = percentage + '%';
            progressBar.textContent = Math.round(percentage) + '%';
            
            if (processed > 0 && total > 0) {
                statusMessage.textContent = `${message} (${processed.toLocaleString()}/${total.toLocaleString()})`;
                addLog(`${message} - ${processed}/${total} (${Math.round(percentage)}%)`);
            } else {
                statusMessage.textContent = message;
                addLog(`${message} (${Math.round(percentage)}%)`);
            }
        }

        function testExport(type) {
            // Reset
            document.getElementById('downloadSection').style.display = 'none';
            document.getElementById('exportLog').innerHTML = '=== Log d\'export ===<br>';
            updateProgress(0, 'Démarrage export ' + type.toUpperCase() + '...');
            
            const sessionId = Date.now().toString();
            const eventSource = new EventSource(`request/export_articles_progressive.php?type=${type}&session=${sessionId}`);
            
            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.error) {
                        updateProgress(0, 'ERREUR: ' + data.message);
                        addLog('ERREUR: ' + data.message);
                        eventSource.close();
                        return;
                    }
                    
                    updateProgress(data.percentage, data.message, data.processed, data.total);
                    
                    if (data.completed && data.downloadUrl) {
                        addLog('Export terminé ! Fichier disponible: ' + data.filename);
                        
                        // Afficher le lien de téléchargement
                        const downloadSection = document.getElementById('downloadSection');
                        const downloadLink = document.getElementById('downloadLink');
                        downloadLink.href = data.downloadUrl;
                        downloadLink.textContent = 'Télécharger ' + data.filename;
                        downloadSection.style.display = 'block';
                        
                        eventSource.close();
                    }
                    
                } catch (e) {
                    addLog('Erreur parsing JSON: ' + e);
                    eventSource.close();
                }
            };
            
            eventSource.onerror = function(event) {
                addLog('Erreur de connexion EventSource');
                updateProgress(0, 'Erreur de connexion');
                eventSource.close();
            };
        }
    </script>
</body>
</html>
